name: Build and publish CINEXT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Package complete project source
        uses: actions/upload-artifact@v4
        with:
          name: CINEXT-full-project-source
          path: |
            **/*
            .github/**
            !.git/**
            !node_modules/**
            !dist/**
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Publish built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
